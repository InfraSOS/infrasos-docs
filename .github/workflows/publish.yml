# Goes in .github/workflows/publish.yml in the infrasos-docs repository.
#
# It lives in the AD Command repository because the thing it publishes is assembled there:
# docs/site/build.py takes the guides that ship inside the product and produces this project.
# Keeping the workflow beside the generator means the two change together.
name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# One publish at a time. Two overlapping runs would both commit to gh-pages and the loser would
# either conflict or silently publish the older tree.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # mike commits to gh-pages, so it needs the branch, not just this commit.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the pinned toolchain
        run: pip install -r requirements.txt

      - name: Read the version being published
        id: version
        run: echo "value=$(cat docs-version.txt)" >> "$GITHUB_OUTPUT"

      - name: Check the site builds
        # --strict first and separately, so a broken internal link fails BEFORE anything is
        # committed to gh-pages. mike would otherwise publish it and report success.
        run: mkdocs build --strict --site-dir /tmp/strict-check

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Deploy ${{ steps.version.outputs.value }}
        # --update-aliases moves "latest" onto this version. Without it a second deploy of the same
        # alias fails rather than replacing it.
        run: |
          git fetch origin gh-pages --depth=1 || echo "No gh-pages branch yet; mike will create it."
          mike deploy --push --update-aliases "${{ steps.version.outputs.value }}" latest
          mike set-default --push latest

      - name: Keep the custom domain
        # GitHub Pages reads CNAME from the ROOT of the published branch. mike owns the version
        # directories, index.html and versions.json, and leaves everything else alone - so this only
        # has to write the file when it is missing, which is the first publish and after any manual
        # reset of the branch.
        run: |
          git fetch origin gh-pages
          git worktree add ../pages gh-pages
          if [ "$(cat ../pages/CNAME 2>/dev/null)" != "$(cat CNAME)" ]; then
            cp CNAME ../pages/CNAME
            git -C ../pages add CNAME
            git -C ../pages commit -m "Set the custom domain"
            git -C ../pages push origin gh-pages
            echo "CNAME written to the gh-pages root."
          else
            echo "CNAME already correct."
          fi
