# Publishes docs.infrasos.com from the main branch.
#
# The site is served at the ROOT of the custom domain (no version prefix). The custom domain is
# preserved by docs/CNAME, which the build copies into the published site root.
name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# One publish at a time, so two runs can't both force-push gh-pages.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the pinned toolchain
        run: pip install -r requirements.txt

      - name: Check the site builds
        # --strict first and separately, so a broken internal link fails BEFORE anything is
        # pushed to gh-pages.
        run: mkdocs build --strict --site-dir /tmp/strict-check

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Publish to GitHub Pages
        run: mkdocs gh-deploy --force
